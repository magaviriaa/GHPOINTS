services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghpoints
      POSTGRES_PASSWORD: ghpoints
      POSTGRES_DB: ghpoints
    ports:
      - "5432:5432"
    volumes:
      - ghpoints_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghpoints -d ghpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ghpoints_pg18:
